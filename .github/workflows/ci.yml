name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    env:
      CLAUDE_API_KEY: ""
      PIPELINE_MODE: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check supported Python syntax
        run: python -m compileall -q app.py config.py routes/upload.py services/claude_pipeline.py tests/backend
      - name: Run backend tests with coverage
        run: python -m pytest -q --cov=app --cov=routes.upload --cov=services.claude_pipeline --cov-report=term-missing

  browser:
    name: Browser and renderer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check browser JavaScript syntax
        run: |
          for file in static/*.js animations/*.js tests/browser/*.js; do
            node --check "$file"
          done
      - name: Run browser and renderer contract tests
        run: node --test tests/browser/*.test.js
